<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>header-gathsession</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>


  <body>
    <script type="module" src="./src/main.js"></script>

    <header class="header">
      <div class="header__container">
        <img src="./img/gathsession-logo.png" alt="Gathsession Logo" class="header__logo" />
        <nav class="header__container__nav">
          <ul class="header__container__nav__list">
            <li><a href="#">Home</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">About Us</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="hero">
      <div class="hero__section">
        <div class="hero__section__title">
          <h1>Build your best community starting from here.</h1>
          <p>Meet and communicate with the best people to run projects, 
            events or other activities in a more effective and fun way</p>
          <div class="hero__section__title__buttons">
            <a href="#" class="start">Get Started</a>
            <a href="#" class="more">Learn More <img src="./img/arrow.svg" alt="Arrow Right"></a>
          </div>
        </div>
        <div class="hero__section__services">
          <div class="hero__section__services__item">
            <img src="./img/community-logo.svg" alt="Community Icon">
            <a href="#">Build Community</a>
          </div>
          <div class="hero__section__services__item">
            <img src="./img/events-logo.svg" alt="Events Icon">
            <a href="#">Share Events</a>
          </div>
          <div class="hero__section__services__item">
            <img src="./img/info-logo.svg" alt="Info Icon">
            <a href="#">Get Information</a>
          </div>
        </div>
      </div>
      <div class="hero__grid">
        <div class="hero__grid__a1"></div>
        <div class="hero__grid__a2"></div>
        <div class="hero__grid__b1"></div>
        <div class="hero__grid__b2"></div>
        <div class="hero__grid__c1"></div>
      </div>
    </div>

  </body>


</html>
